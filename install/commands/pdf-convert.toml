description = "Convert PDF/DOCX/EPUB/PPTX documents to Visually Grounded Markdown and JSON with automated page-level Gemini processing"
prompt = """<objective>
Convert the requested document into Visually Grounded Markdown and structured JSON, running automatically until the pipeline finishes or a real blocking error occurs.
</objective>

<context>
Arguments: $ARGUMENTS

If no file path is provided, ask exactly:
Vui long cung cap duong dan file can chuyen doi.
</context>

<architecture>
Use the automated driver:

  /home/dung/.gemini/pdf-convert/auto_convert.sh

The driver intentionally uses page-level `gemini -p` subprocess calls. This is required for large PDFs because one active chat turn cannot safely hold 100+ high-resolution page images or emit all page Markdown in a single response. Each subprocess receives only one rendered page plus trimmed context, writes one `page_N.md`, and the workspace is deterministic/resumable at `/tmp/pdf_convert_<output_name>/`.

Do not hand-schedule batches in chat. Do not ask the user to type "continue" between batches.
</architecture>

<process>
1. Parse the input path from $ARGUMENTS.
2. Derive `<output_name>` from the input filename stem unless the user supplied a name.
3. Run one shell command:

   bash /home/dung/.gemini/pdf-convert/auto_convert.sh \
     "<input_file_path>" \
     --name "<output_name>" \
     --keep-temp

   Add `--fast` only if the user explicitly requested fast mode or the document is known to need direct PDF rendering.

4. Let the command run to completion. It will:
   - prepare/render pages and create `native_manifest.json`;
   - skip already valid `temp_md/page_N.md` files on resume;
   - call Gemini CLI per page with bounded context;
   - run QA with the native manifest;
   - delete failed page files and retry repair;
   - merge only after QA passes.

5. When the command exits successfully, report the final JSON path printed by the driver.
</process>

<critical_rules>
- AUTO-COMPLETE: do not stop after 5-10 pages just to wait for human confirmation.
- BOUNDED CONTEXT: never load all page images into the active chat context.
- RESUME-SAFE: preserve `/tmp/pdf_convert_<output_name>/` on failures so the same command can resume.
- NO API KEYS: the subprocess client strips API-key/Vertex environment variables and uses Gemini CLI OAuth credentials.
- ZERO-HALLUCINATION: page extraction must remain image-grounded and verbatim; no Docling-only Markdown dumps.
- FAIL-FAST: if Gemini quota, auth, or QA failure blocks completion after retries, stop with the driver error; do not merge partial output.
</critical_rules>
"""
